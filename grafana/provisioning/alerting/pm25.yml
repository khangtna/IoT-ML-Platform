{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "Smart City",
      "folder": "Smart City",
      "interval": "1m",
      "rules": [
        {
          "uid": "smartcity-pm25-alert",
          "title": "PM2.5 anomaly or configured threshold exceeded",
          "condition": "C",
          "for": "1m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "Có bản tin PM2.5 bất thường trong 10 phút gần nhất"
          },
          "labels": {
            "project": "smartcity"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "TimescaleDB",
              "model": {
                "refId": "A",
                "datasource": {
                  "type": "postgres",
                  "uid": "TimescaleDB"
                },
                "format": "time_series",
                "rawQuery": true,
                "rawSql": "SELECT now() AS time, count(*)::double precision AS value FROM active_alerts WHERE timestamp >= now() - interval '10 minutes'",
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last"
                    },
                    "type": "query"
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                }
              }
            }
          ]
        }
      ]
    }
  ]
}
